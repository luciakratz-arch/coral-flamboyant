<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Coral Flamboyant | Gestão Profissional</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7B1020">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Coral Flamboyant">
    <link rel="apple-touch-icon" href="logo.png">
    <script>
      if('serviceWorker' in navigator){
        window.addEventListener('load',function(){
          navigator.serviceWorker.register('./sw.js')
            .then(function(r){console.log('[SW] registrado',r.scope);})
            .catch(function(e){console.log('[SW] erro',e);});
        });
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>
    <script src="app.js?v=3"></script>

    <!-- Modal PWA -->
    <div id="modal-pwa" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99999;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);">
      <div style="background:#fff;border-radius:20px 20px 0 0;padding:28px 24px 40px;width:100%;max-width:500px;box-shadow:0 -4px 32px rgba(0,0,0,0.2);">
        <div style="width:40px;height:4px;background:#e5e7eb;border-radius:2px;margin:0 auto 20px;"></div>
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
          <img src="logo.png" style="width:56px;height:56px;border-radius:12px;object-fit:cover;" onerror="this.style.display='none'">
          <div>
            <div style="font-size:18px;font-weight:700;color:#111;">Coral Flamboyant</div>
            <div style="font-size:13px;color:#666;margin-top:2px;">Instalar app no seu celular?</div>
          </div>
        </div>
        <p style="font-size:14px;color:#444;line-height:1.6;margin-bottom:20px;">Adicione à sua tela inicial para acessar rapidamente, mesmo sem internet!</p>
        <div id="pwa-android">
          <button onclick="instalarPWA()" style="width:100%;padding:14px;border-radius:12px;border:none;background:#7B1020;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:10px;font-family:Inter,sans-serif;">📲 Instalar App</button>
        </div>
        <div id="pwa-ios" style="display:none;background:#f8f8f8;border-radius:10px;padding:14px;margin-bottom:10px;">
          <p style="font-size:13px;font-weight:700;color:#333;margin-bottom:8px;">📱 No iPhone / iPad:</p>
          <p style="font-size:13px;color:#555;line-height:1.8;">1. Toque em <strong>Compartilhar ⬆️</strong> na barra do Safari<br>2. Toque em <strong>"Adicionar à Tela de Início"</strong><br>3. Toque em <strong>Adicionar</strong></p>
          <p style="font-size:11px;color:#f59e0b;margin-top:6px;">⚠️ Deve estar no Safari, não no Chrome.</p>
        </div>
        <button onclick="fecharModalPWA()" style="width:100%;padding:12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;color:#666;font-weight:600;font-size:14px;cursor:pointer;font-family:Inter,sans-serif;">Agora não</button>
      </div>
    </div>

    <script>
    (function(){
      var deferredPrompt = null;
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        deferredPrompt = e;
        window.__pwaPrompt = e;
        console.log('[PWA] beforeinstallprompt capturado');
      });

      window.addEventListener('appinstalled', function(){
        deferredPrompt = null;
        fecharModalPWA();
      });

      window.addEventListener('load', function(){
        if(isStandalone) return;
        var jaViu = localStorage.getItem('pwa_aviso_flamboyant');
        if(jaViu) return;
        // iOS: mostra instruções
        if(isIOS){
          document.getElementById('pwa-android').style.display='none';
          document.getElementById('pwa-ios').style.display='block';
        }
        setTimeout(function(){
          var el = document.getElementById('modal-pwa');
          if(el) el.style.display='flex';
        }, 1500);
      });

      window.instalarPWA = function(){
        if(deferredPrompt){
          var p = deferredPrompt;
          deferredPrompt = null;
          p.prompt();
          p.userChoice.then(function(r){
            console.log('[PWA] resultado:', r.outcome);
            fecharModalPWA();
          });
        } else if(isIOS){
          document.getElementById('pwa-android').style.display='none';
          document.getElementById('pwa-ios').style.display='block';
        } else {
          fecharModalPWA();
        }
      };

      window.fecharModalPWA = function(){
        localStorage.setItem('pwa_aviso_flamboyant', '1');
        var el = document.getElementById('modal-pwa');
        if(el) el.style.display='none';
      };
    })();
    </script>

    <!-- Backup Firestore -->
    <script>
    (function(){
      var COLS=["acessos","avisos","config","confirmacoes","estudos","events","frequencias","members","noticias","relatorios_historico","sessoes_checkin","songs"];
      function p2(x){return x<10?"0"+x:""+x;}
      window.fazerBackupCoral=function(){
        var btn=document.getElementById("btnBackupCoral");
        if(btn){btn.disabled=true;btn.textContent="⏳ Gerando...";}
        var bk={geradoEm:new Date().toLocaleString("pt-BR"),colecoes:{}};
        Promise.all(COLS.map(function(c){
          return db.collection(c).get().then(function(snap){
            var docs={};snap.forEach(function(d){docs[d.id]=d.data();});
            bk.colecoes[c]=docs;
          }).catch(function(){bk.colecoes[c]={_erro:"erro"};}); 
        })).then(function(){
          var blob=new Blob([JSON.stringify(bk,null,2)],{type:"application/json"});
          var url=URL.createObjectURL(blob);
          var a=document.createElement("a");
          var h=new Date();
          a.href=url;a.download="backup-flamboyant-"+p2(h.getDate())+p2(h.getMonth()+1)+h.getFullYear()+".json";
          a.click();URL.revokeObjectURL(url);
          if(btn){btn.disabled=false;btn.textContent="💾 Backup";}
        });
      };
      var b=document.createElement("button");
      b.id="btnBackupCoral";b.textContent="💾 Backup";
      b.style.cssText="position:fixed;bottom:12px;right:12px;z-index:9999;background:#7B1020;color:#fff;border:none;border-radius:18px;padding:7px 14px;font-size:12px;font-family:Inter,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.25);opacity:0.85;";
      b.onclick=window.fazerBackupCoral;
      document.body.appendChild(b);
    })();
    </script>
</body>
</html>
