  <!-- Controle de tamanho das letras -->
  <style>
    #fs-ctl{position:fixed;right:12px;bottom:12px;z-index:9998;display:flex;gap:6px;align-items:center;
      background:#B41020;border-radius:28px;padding:6px 8px;box-shadow:0 2px 10px rgba(0,0,0,.4);}
    #fs-ctl button{width:44px;height:44px;border-radius:50%;border:none;background:#FFFFFF;color:#B41020;
      font-weight:700;cursor:pointer;font-family:inherit;line-height:1;}
    #fs-ctl .menos{font-size:15px;} #fs-ctl .mais{font-size:22px;} #fs-ctl .ouvir{font-size:22px;background:#FFFFFF;color:#B41020;} #fs-ctl .ouvir.falando{background:#C0392B;color:#fff;}
    #fs-ctl button:disabled{opacity:.35;cursor:default;}
    @media (min-width:769px){#fs-ctl{bottom:56px;}}
    @media (max-width:768px){#fs-ctl{bottom:76px;}}
  </style>
  <script>
  (function(){
    var N=[1,1.15,1.3,1.5];
    function get(){var v=1;try{v=parseFloat(localStorage.getItem('app_fs'))||1;}catch(e){}var i=N.indexOf(v);return i<0?0:i;}
    function set(i){
      try{localStorage.setItem('app_fs',String(N[i]));}catch(e){}
      if(typeof window.__setFS==='function'){
        window.__setFS(N[i]);
        var mm=document.querySelector('#fs-ctl .menos'),pp=document.querySelector('#fs-ctl .mais');
        if(mm) mm.disabled=i===0; if(pp) pp.disabled=i===N.length-1;
      } else { location.reload(); }
    }
    var box=document.createElement('div');box.id='fs-ctl';box.setAttribute('aria-label','Tamanho das letras');
    var m=document.createElement('button');m.className='menos';m.textContent='A−';m.title='Diminuir letras';
    var p=document.createElement('button');p.className='mais';p.textContent='A+';p.title='Aumentar letras';
    var i=get();m.disabled=i===0;p.disabled=i===N.length-1;
    m.onclick=function(){set(Math.max(0,get()-1));};
    p.onclick=function(){set(Math.min(N.length-1,get()+1));};
    var o=document.createElement('button');o.className='ouvir';o.id='fs-ouvir';o.textContent='🔊';o.title='Ouvir o que está na tela';o.setAttribute('aria-label','Ouvir o que está na tela');
    box.appendChild(m);box.appendChild(p);box.appendChild(o);
    window.addEventListener('load',function(){document.body.appendChild(box);});
  })();
  </script>


  <!-- Leitura em voz alta (acessibilidade) -->
  <script>
  (function(){
    if(!('speechSynthesis' in window)) return;
    var falando=false, fila=[], pos=0;
    function pegarTexto(){
      var sel=''; try{ sel=String(window.getSelection()).trim(); }catch(e){}
      if(sel) return sel;
      var alvo=null, fixos=document.querySelectorAll('#root [style*="position: fixed"], body > [style*="position: fixed"]');
      for(var k=0;k<fixos.length;k++){
        var el=fixos[k];
        if(el.id==='fs-ctl'||el.id==='modal-pwa'||el.closest('#fs-ctl')) continue;
        var r=el.getBoundingClientRect(), z=parseInt(getComputedStyle(el).zIndex,10)||0;
        if(z>=300 && r.width>200 && r.height>200 && (el.innerText||'').trim().length>20) alvo=el;
      }
      if(!alvo) alvo=document.querySelector('.main-content')||document.getElementById('root');
      return alvo?(alvo.innerText||''):'';
    }
    function dividir(t){
      t=t.replace(/\s*\n+\s*/g,'. ').replace(/\.\s*\./g,'.').replace(/\s+/g,' ').trim();
      var partes=t.match(/[^.!?;:]+[.!?;:]?/g)||[t], out=[], cur='';
      partes.forEach(function(s){
        if((cur+s).length>180){ if(cur) out.push(cur); cur=s; } else cur+=s;
      });
      if(cur) out.push(cur);
      return out;
    }
    function escolherVoz(){
      var v=speechSynthesis.getVoices()||[];
      return v.filter(function(x){return /^pt[-_]BR/i.test(x.lang);})[0]||v.filter(function(x){return /^pt/i.test(x.lang);})[0]||null;
    }
    function botao(){return document.getElementById('fs-ouvir');}
    function parar(){
      falando=false; fila=[]; speechSynthesis.cancel();
      var b=botao(); if(b){ b.classList.remove('falando'); b.textContent='🔊'; b.title='Ouvir o que está na tela'; }
    }
    function proximo(){
      if(!falando) return;
      if(pos>=fila.length){ parar(); return; }
      var u=new SpeechSynthesisUtterance(fila[pos++]);
      u.lang='pt-BR'; u.rate=0.9;
      var v=escolherVoz(); if(v) u.voice=v;
      u.onend=proximo; u.onerror=function(){ if(falando) proximo(); };
      speechSynthesis.speak(u);
    }
    function iniciar(){
      var t=pegarTexto();
      fila=dividir(t); pos=0;
      if(!fila.length) return;
      falando=true;
      var b=botao(); if(b){ b.classList.add('falando'); b.textContent='⏹'; b.title='Parar a leitura'; }
      speechSynthesis.cancel();
      proximo();
    }
    window.addEventListener('load',function(){
      document.addEventListener('click',function(e){
        var b=e.target.closest&&e.target.closest('#fs-ouvir');
        if(!b) return;
        if(falando) parar(); else iniciar();
      });
      window.addEventListener('beforeunload',function(){ speechSynthesis.cancel(); });
    });
  })();
  </script>

    <!-- Modal PWA -->

    <script>
    (function(){
      var deferredPrompt = null;
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        deferredPrompt = e;
        window.__pwaPrompt = e;
        console.log('[PWA] beforeinstallprompt capturado');
      });

      window.addEventListener('appinstalled', function(){
        deferredPrompt = null;
        fecharModalPWA();
      });

      window.addEventListener('load', function(){
        if(isStandalone) return;
        var jaViu = localStorage.getItem('pwa_aviso_flamboyant');
        if(jaViu) return;
        // iOS: mostra instruções
        if(isIOS){
          document.getElementById('pwa-android').style.display='none';
          document.getElementById('pwa-ios').style.display='block';
        }
        setTimeout(function(){
          var el = document.getElementById('modal-pwa');
          if(el) el.style.display='flex';
        }, 1500);
      });

      window.instalarPWA = function(){
        if(deferredPrompt){
          var p = deferredPrompt;
          deferredPrompt = null;
          p.prompt();
          p.userChoice.then(function(r){
            console.log('[PWA] resultado:', r.outcome);
            fecharModalPWA();
          });
        } else if(isIOS){
          document.getElementById('pwa-android').style.display='none';
          document.getElementById('pwa-ios').style.display='block';
        } else {
          fecharModalPWA();
        }
      };

      window.fecharModalPWA = function(){
        localStorage.setItem('pwa_aviso_flamboyant', '1');
        var el = document.getElementById('modal-pwa');
        if(el) el.style.display='none';
      };
    })();
    </script>

    <!-- Backup Firestore -->
    <script>
    (function(){
      if(window.innerWidth < 769) return;
      var COLS=["acessos","avisos","config","confirmacoes","estudos","events","frequencias","members","noticias","relatorios_historico","sessoes_checkin","songs"];
      function p2(x){return x<10?"0"+x:""+x;}
      window.fazerBackupCoral=function(){
        var btn=document.getElementById("btnBackupCoral");
        if(btn){btn.disabled=true;btn.textContent="⏳ Gerando...";}
        var bk={geradoEm:new Date().toLocaleString("pt-BR"),colecoes:{}};
        Promise.all(COLS.map(function(c){
          return db.collection(c).get().then(function(snap){
            var docs={};snap.forEach(function(d){docs[d.id]=d.data();});
            bk.colecoes[c]=docs;
          }).catch(function(){bk.colecoes[c]={_erro:"erro"};});
        })).then(function(){
          var blob=new Blob([JSON.stringify(bk,null,2)],{type:"application/json"});
          var url=URL.createObjectURL(blob);
          var a=document.createElement("a");
          var h=new Date();
          a.href=url;a.download="backup-flamboyant-"+p2(h.getDate())+p2(h.getMonth()+1)+h.getFullYear()+".json";
          a.click();URL.revokeObjectURL(url);
          if(btn){btn.disabled=false;btn.textContent="💾 Backup";}
        });
      };
      var b=document.createElement("button");
      b.id="btnBackupCoral";b.textContent="💾 Backup";
      b.style.cssText="position:fixed;bottom:12px;right:12px;z-index:9999;background:#7B1020;color:#fff;border:none;border-radius:18px;padding:7px 14px;font-size:12px;font-family:Inter,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.25);opacity:0.85;display:none;";
      b.onclick=window.fazerBackupCoral;
      document.body.appendChild(b);
      // Exibe apenas para admin
      var _chkAdmin = setInterval(function(){
        try {
          var u = JSON.parse(localStorage.getItem('cf_user') || 'null');
          if(u && u.isAdmin === true){
            b.style.display='block';
            clearInterval(_chkAdmin);
          }
        } catch(e){}
      }, 1000);
    })();
    </script>
